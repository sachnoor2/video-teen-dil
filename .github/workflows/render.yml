name: Render Hindi cartoon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  render:
    name: Hindi voices + Remotion render
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Make sure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      # Two clean Hindi Piper voices. Every character is one of these two,
      # re-pitched and re-paced by scripts/tts_hi.py into five distinct voices.
      - name: Download Piper and the two Hindi voices
        run: |
          set -euo pipefail
          mkdir -p .piper .voices
          curl -fsSL -o .piper/piper.tar.gz \
            https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf .piper/piper.tar.gz -C .piper
          B="https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN"
          for v in pratham priyamvada; do
            curl -fsSL -o .voices/hi_IN-$v-medium.onnx      "$B/$v/medium/hi_IN-$v-medium.onnx"
            curl -fsSL -o .voices/hi_IN-$v-medium.onnx.json "$B/$v/medium/hi_IN-$v-medium.onnx.json"
          done
          ls -lh .voices

      - name: Generate the five character voices and the timing manifest
        run: |
          python3 scripts/tts_hi.py --piper .piper/piper/piper --voices-dir .voices
          cat src/manifest.json | head -20

      - name: Type-check
        run: npx tsc --noEmit

      - name: Render the cartoon
        run: |
          npx remotion render src/index.ts TeenDil \
            out/teen-dil.mp4 \
            --gl=swangle --concurrency=3 --log=info

      - name: Join the narration and verify the MP4
        run: |
          set -euo pipefail
          ffmpeg -y -hide_banner -loglevel error \
            -f concat -safe 0 -i public/audio/list.txt -c copy out/narration.wav
          echo "=== container ==="
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 out/teen-dil.mp4
          echo "=== streams ==="
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate \
            -of default=nw=1 out/teen-dil.mp4
          echo "=== audio level ==="
          ffmpeg -hide_banner -i out/teen-dil.mp4 -t 30 -af volumedetect -f null - 2>&1 | grep -E "mean_volume|max_volume"

      - name: Upload the finished cartoon
        uses: actions/upload-artifact@v4
        with:
          name: teen-dil
          path: |
            out/teen-dil.mp4
            out/narration.wav
          if-no-files-found: error
