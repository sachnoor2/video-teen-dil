name: Render Hindi cartoon (3D, chunked)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  plan:
    name: Voices, typecheck, chunk plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Make sure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi

      - name: Download Piper and the two Hindi voices
        run: |
          set -euo pipefail
          mkdir -p .piper .voices
          curl -fsSL -o .piper/piper.tar.gz \
            https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf .piper/piper.tar.gz -C .piper
          B="https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN"
          for v in pratham priyamvada; do
            curl -fsSL -o .voices/hi_IN-$v-medium.onnx      "$B/$v/medium/hi_IN-$v-medium.onnx"
            curl -fsSL -o .voices/hi_IN-$v-medium.onnx.json "$B/$v/medium/hi_IN-$v-medium.onnx.json"
          done

      - name: Generate the five character voices, envelopes and timing manifest
        run: python3 scripts/tts_hi.py --piper .piper/piper/piper --voices-dir .voices

      - name: Type-check
        run: npx tsc --noEmit

      - id: plan
        run: |
          CHUNKS=$(python3 scripts/render_chunks.py --plan --json --chunk-seconds 55)
          echo "chunks=$CHUNKS" >> "$GITHUB_OUTPUT"
          echo "$CHUNKS" | head -c 400

      - uses: actions/upload-artifact@v4
        with:
          name: narration
          path: |
            public/audio
            src/manifest.json
          retention-days: 7

  render:
    name: Render chunk ${{ matrix.chunk.index }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Make sure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi

      - uses: actions/download-artifact@v4
        with:
          name: narration

      - name: Render this chunk
        run: python3 scripts/render_chunks.py --only ${{ matrix.chunk.index }}

      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk.index }}
          path: out/chunks/chunk-*.mp4
          if-no-files-found: error
          retention-days: 7

  stitch:
    name: Stitch, verify, upload
    needs: [plan, render]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Make sure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi

      - uses: actions/download-artifact@v4
        with:
          name: narration

      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          merge-multiple: true
          path: out/chunks

      - name: Stitch in order and verify
        run: |
          python3 scripts/stitch.py --chunk-seconds 55 --out out/teen-dil.mp4
          cat out/stitch-report.json || true

      - name: Verify the delivered file
        run: |
          set -euo pipefail
          echo "=== container ==="
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 out/teen-dil.mp4
          echo "=== streams ==="
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate \
            -of default=nw=1 out/teen-dil.mp4
          echo "=== audio level ==="
          ffmpeg -hide_banner -i out/teen-dil.mp4 -t 30 -af volumedetect -f null - 2>&1 | grep -E "mean_volume|max_volume"

      - uses: actions/upload-artifact@v4
        with:
          name: teen-dil
          path: |
            out/teen-dil.mp4
            public/audio/list.txt
          if-no-files-found: error
          retention-days: 14
